services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=false
    ports:
      - "127.0.0.1:3006:80"
    volumes:
      - vaultwarden-data:/data
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  vaultwarden-data:
