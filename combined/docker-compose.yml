x-shared: &shared
  restart: always
  image: docker.n8n.io/n8nio/n8n
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - WEBHOOK_URL=${WEBHOOK_URL}
  volumes:
    - n8n_data:/home/node/.n8n
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  app:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data
    networks:
      - proxy

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=UTC # optional: set desired timezone
    user: 0:0
    volumes:
      - /var/cache/ntfy:/var/cache/ntfy
      - /etc/ntfy:/etc/ntfy
    networks:
      - proxy
    ports:
      - "127.0.0.1:3002:80"
    healthcheck: # optional: remember to adapt the host:port to your environment
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  my-static-site:
    image: nginx:alpine
    container_name: my-static-site
    ports:
      - "127.0.0.1:3003:80"
    volumes:
      - /root/nginx/astro-site:/usr/share/nginx/html
    networks:
      - proxy

  football-transfers-site:
    image: nginx:alpine
    container_name: football-transfers-site
    ports:
      - "127.0.0.1:3005:80"
    volumes:
      - /root/nginx/football-transfers:/usr/share/nginx/html
    networks:
      - proxy

  privatebin:
    container_name: privatebin
    restart: always
    read_only: true
    user: 1000:1000
    image: privatebin/nginx-fpm-alpine:latest
    ports:
      - "127.0.0.1:3004:8080"
    volumes:
      - "./privatebin-data:/srv/data"
    networks:
      - proxy

  browserless:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
      - MAX_CONCURRENT_SESSIONS=10
    networks:
      - proxy
    shm_size: "2gb"

  changedetection:
    container_name: changedetection
    restart: unless-stopped
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - "changedetection-data:/datastore"
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://browserless:3000/?stealth=1&--disable-web-security=true
    networks:
      - proxy
    depends_on:
      - browserless

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=false
    ports:
      - "127.0.0.1:3006:80"
    volumes:
      - vaultwarden-data:/data
    networks:
      - proxy

  postgres:
    image: postgres:16
    restart: always
    environment:
      # Define these in your .env file
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  redis:
    image: redis:7
    restart: always
    networks:
      - proxy
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    <<: *shared
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - proxy

  n8n-worker:
    <<: *shared
    command: worker
    networks:
      - proxy
    depends_on:
      - n8n

networks:
  proxy:
    driver: bridge

volumes:
  uptime-kuma:
  changedetection-data:
  db_storage:
  redis_storage:
  n8n_data:
  vaultwarden-data:
